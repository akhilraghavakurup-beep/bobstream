name: Build BobStream APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Release Keystore
      run: |
        keytool -genkeypair -v -keystore release.jks -alias bobstream -keyalg RSA -keysize 2048 -validity 10000 -storepass bobstream_signing_key_2026 -keypass bobstream_signing_key_2026 -dname "CN=BobStream, OU=Media, O=BobStream, L=San Francisco, ST=CA, C=US"

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bobstream-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 14
