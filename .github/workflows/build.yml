name: Build BobStream APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - 'updater.py'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/bot.yml'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - 'updater.py'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/bot.yml'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bobstream-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 14

    - name: Publish GitHub Release for In-App OTA
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.3.3"
        gh release delete "$TAG_NAME" --yes 2>/dev/null || true
        git tag -d "$TAG_NAME" 2>/dev/null || true
        git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true
        gh release create "$TAG_NAME" app/build/outputs/apk/release/app-release.apk \
          --title "BobStream $TAG_NAME" \
          --notes "BobStream Release v1.3.3: Permanent release keystore for seamless dirty flash OTA, interactive swipe volume/brightness animations & HUD indicators, stream history in Manual Stream, app launch animation, and updated minimal sports collage thumbnails."
