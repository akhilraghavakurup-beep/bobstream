name: Build BobStream APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - 'updater.py'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/bot.yml'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'config.json'
      - 'updater.py'
      - 'requirements.txt'
      - 'scripts/**'
      - '.github/workflows/bot.yml'
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Run Unit Tests
      run: ./gradlew test --stacktrace

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bobstream-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 14

    - name: Publish GitHub Release for In-App OTA
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="v1.4.0"
        gh release delete "$TAG_NAME" --yes 2>/dev/null || true
        git tag -d "$TAG_NAME" 2>/dev/null || true
        git push origin ":refs/tags/$TAG_NAME" 2>/dev/null || true
        cat << 'EOF' > release_notes.md
        BobStream Release v1.4.0 (Build 8):
        - Fullscreen Landscape Only Status Bar hiding (status bar remains visible in portrait & when paused).
        - Native Vertical Animated Volume & Brightness edge sliders with fluid gradient fill.
        - In-Player HUD: Live Clock & Battery Percentage in top overlay bar.
        - Media Playback Lifecycle & AudioFocus: Auto-pause playback on screen off (power button) and incoming phone calls.
        - Decrypted Screen Casting dialog for Wireless Display / Miracast (seamless TV playback of ClearKey DRM streams).
        - Telegram Scraper engine upgrade: Asterisk stripping, expired token rejection, standalone KID:KEY auto-stitching, and smart semantic sports match title inference.
        - About Screen with 'Developed by Kurup', Build 8, and full Changelog.
        - Local APK Download: Save downloaded APK to Downloads folder if in-app update fails or for manual install.
        EOF
        gh release create "$TAG_NAME" app/build/outputs/apk/release/app-release.apk \
          --title "BobStream $TAG_NAME" \
          --notes-file release_notes.md
